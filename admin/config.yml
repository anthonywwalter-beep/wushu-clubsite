# Set these to your real deployed site URL when hosting is finalized.
site_url: "https://your-site-domain.example.com"
display_url: "https://your-site-domain.example.com"

backend:
  name: github
  repo: anthonywwalter-beep/wushu-clubsite
  branch: main
  # Replace with your real OAuth provider endpoint for Decap GitHub auth.
  base_url: "https://your-oauth-provider.example.com"
  auth_endpoint: "/auth"

# Optional local workflow support for Decap local proxy server.
local_backend: true

publish_mode: simple

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "site_pages"
    label: "Site Pages"
    files:
      - name: "homepage"
        label: "Homepage"
        file: "content/homepage.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
              - label: "Subtitle"
                name: "subtitle"
                widget: "string"
          - label: "Sections"
            name: "sections"
            widget: "object"
            fields:
              - label: "Who We Are"
                name: "whoWeAre"
                widget: "object"
                fields:
                  - label: "Section Title"
                    name: "title"
                    widget: "string"
                  - label: "Content"
                    name: "content"
                    widget: "text"
              - label: "What We Do"
                name: "whatWeDo"
                widget: "object"
                fields:
                  - label: "Section Title"
                    name: "title"
                    widget: "string"
                  - label: "Content"
                    name: "content"
                    widget: "text"

      - name: "about"
        label: "About Page"
        file: "content/about.md"
        fields:
          - label: "About Content"
            name: "body"
            widget: "markdown"

  - name: "operations"
    label: "Operations"
    files:
      - name: "officers"
        label: "Officers"
        file: "content/officers.json"
        format: "json"
        fields:
          - label: "Officers"
            name: "officers"
            widget: "list"
            summary: "{{fields.name}} - {{fields.role}}"
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
              - label: "Role"
                name: "role"
                widget: "string"
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false

      - name: "practices"
        label: "Practice Info"
        file: "content/practices.json"
        format: "json"
        fields:
          - label: "Title"
            name: "title"
            widget: "string"
          - label: "Location"
            name: "location"
            widget: "string"
          - label: "Days"
            name: "days"
            widget: "list"
            field:
              label: "Day Entry"
              name: "days"
              widget: "string"
          - label: "Time"
            name: "time"
            widget: "string"
          - label: "Notes"
            name: "notes"
            widget: "list"
            field:
              label: "Note"
              name: "note"
              widget: "string"
