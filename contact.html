<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UO Wushu</title>
    <link rel="stylesheet" href="contact_style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>  
    <header class="navbar">
        <a class="brand-link" href="index.html" aria-label="Go to homepage">
            <div class="logo-section">
                <img src="Images/WushuDuck.png" alt="UO Wushu Logo" class="logo">
                <span class="site-title">UOWUSHU</span>
            </div>
        </a>

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="https://www.givecampus.com/campaigns/67036/donations/new?designation_id=5797121&">Donate</a>
            <a href="contact.html" class="active" aria-current="page">Contact Us</a>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-card">
            <p class="eyebrow">Get in touch</p>
            <h1>Send us a message</h1>
            <p class="contact-copy">Questions about practices, events, or joining the club? Reach out and we’ll get back to you.</p>

            <form id="contactForm" class="message-form" novalidate>
                <input type="text" name="website" class="honeypot" tabindex="-1" autocomplete="off">
                <input type="hidden" name="form_started_at" id="form_started_at">

                <div class="field-row">
                    <div class="field-group">
                        <label for="name">Name</label>
                        <input id="name" name="name" type="text" placeholder="Your name" required>
                    </div>
                    <div class="field-group">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="field-group">
                    <label for="subject">Subject</label>
                    <input id="subject" name="subject" type="text" placeholder="" required>
                </div>

                <div class="field-group">
                    <label for="message">Your message</label>
                    <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="submit-button">Send message</button>
                <p id="form-status" class="form-status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('contactForm');
            const status = document.getElementById('form-status');
            const startedAtField = document.getElementById('form_started_at');

            startedAtField.value = Date.now();

            form.addEventListener('submit', async function (event) {
                event.preventDefault();

                const formData = new FormData(form);
                const payload = {
                    name: String(formData.get('name') || '').trim(),
                    email: String(formData.get('email') || '').trim(),
                    subject: String(formData.get('subject') || '').trim(),
                    message: String(formData.get('message') || '').trim(),
                    website: String(formData.get('website') || '').trim()
                };

                const honeypotFilled = payload.website.length > 0;
                const startedAt = Number(formData.get('form_started_at') || 0);
                const timeElapsed = Date.now() - startedAt;
                const isMessageValid = payload.name.length >= 2 && payload.subject.length >= 3 && payload.message.length >= 10;

                if (honeypotFilled || timeElapsed < 3000 || !isMessageValid) {
                    status.textContent = 'Please complete the form, wait a moment before submitting, and include a clear name, subject, and message before sending.';
                    status.className = 'form-status error';
                    return;
                }

                status.textContent = 'Sending...';
                status.className = 'form-status';

                try {
                    const response = await fetch('https://formsubmit.co/ajax/e8b10e7be8916e37a1fb0a1659162ce5', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({
                            name: payload.name,
                            email: payload.email,
                            subject: payload.subject,
                            message: payload.message
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Submission failed');
                    }

                    form.reset();
                    startedAtField.value = Date.now();
                    status.textContent = 'Your message was sent successfully.';
                    status.classList.add('success');
                } catch (error) {
                    status.textContent = 'Something went wrong. Please email wushu@uoregon.edu directly.';
                    status.classList.add('error');
                }
            });
        });
    </script>
</body>
