<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="calender_style.css">
</head>

<body>  
    <header class="navbar">
        
        <div class="logo-section">
            <img src="Images/WushuLogo.png" alt="UO Wushu Logo" class="logo">
            <span class="site-title">UOWUSHU</span>
        </div>

        <nav class="nav-links">
            <a href="homepage.html">Home</a>
            <a href="calendar.html">Calendar</a>
            <a href="https://www.givecampus.com/campaigns/67036/donations/new?designation_id=5797121&">Donate</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <div class="content">
        <h1>Our Schedule</h1>
        <p>Standard practice times for the club.</p>
    </div>

    <main class="schedule-container">
        <section class="schedule-card">
            <div class="schedule-header">
                <h2>Standard Practice Times</h2>
            </div>

            <div class="practice-grid" id="practice-grid">
                <article class="practice-item">
                    <h3>Monday</h3>
                    <p>6:00 PM - 8:00 PM</p>
                </article>
                <article class="practice-item">
                    <h3>Wednesday</h3>
                    <p>6:00 PM - 8:00 PM</p>
                </article>
                <article class="practice-item">
                    <h3>Friday</h3>
                    <p>6:00 PM - 8:00 PM</p>
                </article>
                <article class="practice-item">
                    <h3>Saturday</h3>
                    <p>10:00 AM - 12:00 PM</p>
                </article>
            </div>
        </section>
    </main>

    <script src="calendar.js"></script>
</body>
